# =====================================================================
#  MENUS
#  The main menu at the top of every page, and the "Information" links
#  in the footer.
#
#  The logo sits in the middle of the menu: items under `left:` appear to
#  the left of the logo, items under `right:` to the right of it.
#
#  Each item has:
#    title:     the big word in the menu
#    subtitle:  the small text underneath (optional)
#    url:       where it links to
#    submenu:   a list of items that drop down when you hover (optional)
# =====================================================================

