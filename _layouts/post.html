---
layout: default
---
<div class="page-title-area">
  <p class="page-title page-title-small"><a href="{{ '/news/' | relative_url }}">News</a></p>
</div>

<main class="paper">
  <article class="content post">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
    {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="">{% endif %}
    {{ content }}
    <p class="back-link"><a href="{{ '/news/' | relative_url }}">&laquo; All news</a></p>
  </article>
</main>
